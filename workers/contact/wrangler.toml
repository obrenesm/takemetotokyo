# The contact form's endpoint (see README.md). Deploy from this folder with `wrangler deploy`.
name = "take-me-contact"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Keep the Worker's logs (Cloudflare dashboard → Workers → take-me-contact → Logs), so a rejected
# message can be traced afterwards. They never include the message, the token or the secrets
[observability]
enabled = true

[vars]
# The pages allowed to post (the site's origin)
ALLOWED_ORIGINS = "https://take-me.jp,https://www.take-me.jp"
# Hostnames a Turnstile answer may come from (never localhost here: local development uses
# Cloudflare's test keys, see dev-server.js)
TURNSTILE_HOSTNAMES = "take-me.jp,www.take-me.jp"
# Resend's "Contact form message" template (alias contact-form-message): HTML, sender
# take-me.jp <contact@mail.take-me.jp>. Not a secret
RESEND_TEMPLATE_ID = "168f7a50-d45e-44be-836a-fd625a15eac8"

# Secrets, set once with `wrangler secret put <NAME>`, which asks for the value (never in this file):
#   TURNSTILE_SECRET_KEY   the secret key of the Turnstile widget
#   RESEND_API_KEY         a Resend key with sending access to mail.take-me.jp only
#   MAIL_TO                where the messages arrive
